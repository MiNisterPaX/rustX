name: Verify tested integration outputs

on:
  push:
    branches: [codex/validate-harness-ui-main]

permissions:
  contents: read
  actions: read

jobs:
  verified-outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the exact product source exercised by Linux validation
        run: >-
          git diff --exit-code 8ce092455525700f095f4e9c65e0671f1d223c09 HEAD -- .
          ':(exclude).github/workflows/fork-integration-validation.yml'
          ':(exclude)protocol/app-server/v39.schema.json'
          ':(exclude)web-console/test/e2e/*-snapshots/*.png'
      - name: Download the immutable generated and strictly tested outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 37899389232 --repo MiNisterPaX/rustX
          --name fork-integration-evidence --dir "$RUNNER_TEMP/rustx-evidence"
      - name: Match every generated protocol file and Linux screenshot byte
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd()
          evidence = Path(os.environ['RUNNER_TEMP']) / 'rustx-evidence'
          names = ['protocol/app-server/v39.schema.json', 'protocol/app-server/v39.ts',
                   'protocol/app-server/fixtures.json', 'protocol/app-server/fixtures.ts']
          names += [str(p.relative_to(evidence)) for p in sorted((evidence / 'web-console/test/e2e').glob('*-snapshots/*-linux.png'))]
          assert len(names) == 128, len(names)
          for name in names:
              assert (root / name).read_bytes() == (evidence / name).read_bytes(), name
          print(f'{len(names)} generated and tested files match exactly')
          print('Evidence: Rust fmt/Clippy; 12 reading, 109 Runtime Client, 7 schema tests;')
          print('Web/TUI/protocol typechecks; 329 UI tests; 66 TUI tests; 55 strict browser tests; provenance/i18n.')
          PY
