name: Fork integration validation

on:
  push:
    branches: [codex/validate-harness-ui-main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-console
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Install locked dependencies
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm --dir ../protocol/app-server install --frozen-lockfile
          pnpm --dir ../tui install --frozen-lockfile
          pnpm install --frozen-lockfile
          cd ../test-support/fake-provider
          uv sync --frozen
      - name: Rust format and strict lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Native reading regressions and real fixture binaries
        run: |
          cargo test --lib --all-features --locked durable::sqlite::reading_tests
          cargo test --test scripted --all-features --locked runtime_client::
          cargo build --bins --example document_artifact_fixture --locked
      - name: Regenerate native protocol and verify drift
        id: protocol
        continue-on-error: true
        run: pnpm --dir protocol/app-server check
      - name: Shared protocol and client typechecks
        run: |
          cargo test --lib --all-features --locked app_server::schema::tests
          pnpm --dir protocol/app-server typecheck
          pnpm --dir tui typecheck
          pnpm --dir web-console typecheck
      - name: TUI protocol and export regressions
        working-directory: tui
        run: node --test test/app-server-client.test.ts test/session-export.test.ts
      - name: UI and native client regression suites
        working-directory: web-console
        run: >-
          pnpm exec vitest run
          test/settings.test.tsx test/submission-policy.test.ts
          test/composer-preferences.test.ts test/composer-escape.test.tsx
          test/composer-cancellation.test.tsx test/composer.test.tsx
          test/reading-navigation.test.ts test/turn-navigator.test.tsx
          test/fork-point.test.tsx test/present.test.tsx test/client.test.ts
          test/agent.test.tsx test/commands.test.tsx
          test/response-tail.test.tsx test/compaction-summary.test.tsx
      - name: Translation and provenance ownership
        working-directory: web-console
        run: |
          pnpm check:i18n
          pnpm check:provenance
      - name: Refresh affected references with the pinned Linux browser
        working-directory: web-console
        run: >-
          pnpm test:e2e:update
          test/e2e/agent.spec.ts test/e2e/settings-presentation.spec.ts
          test/e2e/fork-point.spec.ts test/e2e/compaction-summary.spec.ts
          test/e2e/reading.spec.ts test/e2e/compaction.spec.ts
      - name: Verify references in ordinary strict mode
        working-directory: web-console
        run: >-
          pnpm test:e2e
          test/e2e/agent.spec.ts test/e2e/settings-presentation.spec.ts
          test/e2e/fork-point.spec.ts test/e2e/compaction-summary.spec.ts
          test/e2e/reading.spec.ts test/e2e/compaction.spec.ts
      - name: Fail on any native protocol drift
        if: always()
        run: test '${{ steps.protocol.outcome }}' = success
      - name: Preserve generated protocol and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-integration-evidence
          path: |
            protocol/app-server/v39.schema.json
            protocol/app-server/v39.ts
            protocol/app-server/fixtures.json
            protocol/app-server/fixtures.ts
            web-console/test/e2e/*-snapshots/
            web-console/test-results/
          if-no-files-found: error
