name: Focused workflow editor verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-editor:
    name: Workflow editor model-node browser regression
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: ./.github/actions/libclang
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-console
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
      - name: Install pinned Web dependencies
        working-directory: web-console
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Install pinned TUI and development dependencies
        run: |
          (cd tui && pnpm install --frozen-lockfile)
          (cd dev && pnpm install --frozen-lockfile)
      - uses: ./.github/actions/document-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Prepare provider emulator
        working-directory: test-support/fake-provider
        run: uv sync --frozen
      - name: Build native binaries and artifact fixture
        run: cargo build --bins --example document_artifact_fixture --locked
      - name: Build production Web bundle
        working-directory: web-console
        run: pnpm build
      - name: Repeat focused browser scenario
        working-directory: web-console
        run: bash scripts/browser-tests.sh test/e2e/workflow-editor.spec.ts:475 --repeat-each=3
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-workflow-editor-evidence
          path: |
            web-console/test-results/
            web-console/blob-report/
            web-console/shard-report/
          if-no-files-found: warn
